# Liara is configured to deploy only when CI passes, so this workflow is what
# releases the site. It has to run on the branch being deployed - the older
# workflow only ran on main, so on this branch there was never any CI result at
# all and the deploy waited forever for a check that could not arrive.
name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # One version, matching what the app requires and what the host runs.
      # Testing against 18 and 20 would only ever fail: the database uses
      # node:sqlite, which does not exist before 22.5.
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - run: npm ci

      # Boots the real server and asks it for the pages a visitor hits first.
      - run: npm test
