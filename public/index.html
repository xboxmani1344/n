<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Study Buddy — An Examination Booklet in Four Parts</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="desk">
    <div class="booklet">
      <div class="booklet-head">
        <p class="wordmark">Study <span>Buddy</span></p>
        <p class="subtitle">An examination booklet in four parts</p>
      </div>

      <ol class="tabs" id="phase-tracker" aria-label="Study phases"></ol>

      <div class="transcript" id="chat-log" aria-live="polite"></div>

      <form class="composer" id="composer">
        <textarea
          id="message-input"
          placeholder="Write your answer here…"
          rows="2"
          autofocus
        ></textarea>
        <button type="submit" id="send-btn" class="stamp primary">Send</button>
      </form>

      <div class="footline">
        <span id="foot-phase">Part I of IV · Warm-Up</span>
        <span class="footline-actions">
          <button type="button" id="next-phase-btn" class="stamp">Next Part →</button>
          <button type="button" id="restart-btn" class="stamp">New Booklet</button>
        </span>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
