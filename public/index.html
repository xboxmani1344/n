<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Study Buddy</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="desk">
    <div class="shell">
      <header class="brand">
        <h1>Study Buddy</h1>
        <p class="tagline">Four phases. One session.</p>
      </header>

      <div class="segmented glass" id="phase-tracker" role="list" aria-label="Study phases"></div>

      <div class="chat-card glass">
        <div class="transcript" id="chat-log" aria-live="polite"></div>
      </div>

      <form class="composer glass" id="composer">
        <textarea
          id="message-input"
          placeholder="Message Study Buddy…"
          rows="1"
          autofocus
        ></textarea>
        <button type="submit" id="send-btn" class="send-btn" aria-label="Send">↑</button>
      </form>

      <div class="controls">
        <span class="status" id="foot-phase">Warm-Up — step 1 of 4</span>
        <span class="controls-actions">
          <button type="button" id="next-phase-btn" class="pill-btn glass">Next Phase</button>
          <button type="button" id="restart-btn" class="pill-btn glass">Restart</button>
        </span>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
