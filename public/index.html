<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Study Buddy</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="desk">
    <div class="shell" id="auth-shell" hidden>
      <header class="brand">
        <h1>Study Buddy</h1>
        <p class="tagline">Sign in to start studying</p>
      </header>

      <div class="chat-card glass auth-card">
        <div class="auth-tabs">
          <button type="button" class="auth-tab active" data-tab="login">Log In</button>
          <button type="button" class="auth-tab" data-tab="signup">Sign Up</button>
        </div>

        <form id="login-form" class="auth-form">
          <input type="email" name="email" placeholder="Email" required autocomplete="email" />
          <input type="password" name="password" placeholder="Password" required autocomplete="current-password" />
          <p class="auth-error" id="login-error"></p>
          <button type="submit" class="pill-btn primary-btn">Log In</button>
        </form>

        <form id="signup-form" class="auth-form" hidden>
          <input type="text" name="displayName" placeholder="Name" autocomplete="name" />
          <input type="email" name="email" placeholder="Email" required autocomplete="email" />
          <input
            type="password"
            name="password"
            placeholder="Password (min. 8 characters)"
            required
            autocomplete="new-password"
            minlength="8"
          />
          <p class="auth-error" id="signup-error"></p>
          <button type="submit" class="pill-btn primary-btn">Create Account</button>
        </form>

        <div class="auth-divider"><span>or</span></div>
        <a href="/api/auth/google" class="pill-btn google-btn" id="google-btn">Continue with Google</a>
      </div>
    </div>

    <div class="shell" id="app-shell" hidden>
      <header class="brand">
        <h1>Study Buddy</h1>
        <p class="tagline">Four phases. One session.</p>
      </header>

      <div class="segmented glass" id="phase-tracker" role="list" aria-label="Study phases"></div>

      <div class="chat-card glass">
        <div class="transcript" id="chat-log" aria-live="polite"></div>
      </div>

      <form class="composer glass" id="composer">
        <textarea
          id="message-input"
          placeholder="Message Study Buddy…"
          rows="1"
        ></textarea>
        <button type="submit" id="send-btn" class="send-btn" aria-label="Send">↑</button>
      </form>

      <div class="controls">
        <span class="status" id="foot-phase">Warm-Up — step 1 of 4</span>
        <span class="controls-actions">
          <button type="button" id="next-phase-btn" class="pill-btn glass">Next Phase</button>
          <button type="button" id="restart-btn" class="pill-btn glass">Restart</button>
          <button type="button" id="logout-btn" class="pill-btn glass">Log Out</button>
        </span>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
