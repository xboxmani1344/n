<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Study Buddy — 4-Phase Study Chatbot</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="app">
    <header class="app-header">
      <h1>📚 Study Buddy</h1>
      <p class="tagline">A study session in four phases: Warm-Up → Learn → Practice → Review</p>
    </header>

    <ol class="phase-tracker" id="phase-tracker" aria-label="Study phases"></ol>

    <main class="chat-panel">
      <div class="chat-log" id="chat-log" aria-live="polite"></div>

      <form class="composer" id="composer">
        <textarea
          id="message-input"
          placeholder="Type your message..."
          rows="2"
          autofocus
        ></textarea>
        <div class="composer-actions">
          <button type="button" id="next-phase-btn" class="secondary-btn">Next Phase →</button>
          <button type="button" id="restart-btn" class="secondary-btn">Restart</button>
          <button type="submit" id="send-btn" class="primary-btn">Send</button>
        </div>
      </form>
    </main>
  </div>

  <script src="app.js"></script>
</body>
</html>
